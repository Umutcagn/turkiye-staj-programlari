name: contribution-approved

# Bir moderatör issue'ya `approved` etiketi koyunca formu programs.json'a işler.
# Etiket koymak yazma/triage yetkisi ister; issue metni kabuk komutlarına
# hiç girmez, yalnızca olay dosyasından Python ile okunur.
on:
  issues:
    types: [labeled]

concurrency:
  group: programs-json
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Process contribution
        id: islem
        continue-on-error: true
        run: python main.py contribution "$GITHUB_EVENT_PATH"
      - name: Regenerate README and commit
        if: steps.islem.outputs.basarili == 'true'
        run: |
          python main.py readme
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programs.json README.md
          git diff --cached --quiet || git commit -m "Katkı #${{ github.event.issue.number }} işlendi"
          git push
      - name: Comment and close
        if: steps.islem.outputs.basarili == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE" --comment "$(cat sonuc.md)" --repo "$GITHUB_REPOSITORY"
      - name: Comment on failure
        if: steps.islem.outputs.basarili != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file sonuc.md --repo "$GITHUB_REPOSITORY"
          gh issue edit "$ISSUE" --remove-label approved --repo "$GITHUB_REPOSITORY"
