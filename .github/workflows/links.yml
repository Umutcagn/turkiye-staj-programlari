name: link-check

# Haftalık: açılmayan linkleri bir issue'da listeler. Bazı kurum siteleri
# bot trafiğini engellediği için sonuç bir kontrol listesidir, otomatik silme yapılmaz.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        id: kontrol
        run: python main.py links --cikti link_raporu.md
      # Her hafta yeni issue açmak yerine açık olan tek issue'yu günceller,
      # her şey açılıyorsa onu kapatır.
      - name: Update link issue
        env:
          GH_TOKEN: ${{ github.token }}
          BASLIK: "Link kontrolü: açılmayan linkler"
          SORUNLU: ${{ steps.kontrol.outputs.sorunlu }}
        run: |
          mevcut=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$BASLIK\" in:title" --json number --jq '.[0].number // empty')
          if [ "$SORUNLU" = "true" ]; then
            if [ -n "$mevcut" ]; then
              gh issue edit "$mevcut" --repo "$GITHUB_REPOSITORY" --body-file link_raporu.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$BASLIK" --body-file link_raporu.md
            fi
          elif [ -n "$mevcut" ]; then
            gh issue close "$mevcut" --repo "$GITHUB_REPOSITORY" --comment "Bu haftaki kontrolde tüm linkler açıldı."
          fi
